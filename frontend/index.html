<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Archaeological Discovery Explorer — Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
  <style>
    html,body,#map { height: 100%; margin: 0; padding: 0; }
    #controls { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 8px; border-radius: 4px; max-width: 320px; }
    #results { max-height: 300px; overflow: auto; font-size: 13px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="controls">
    <div>
      <button id="search-sentinel">Search Sentinel</button>
      <label>Start <input id="start" type="date"></label>
      <label>End <input id="end" type="date"></label>
    </div>
    <div id="results"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="app.js"></script>
</body>
</html>
